[project]
name = "tasktrack"
version = "0.1.0"
description = "Toy task tracker — fixture for the Day27 HITL PR-review lab."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tasktrack = "tasktrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasktrack"]
